<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reservas Institucionales — Panel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dash">

  <!-- Fondo -->
  <div class="aurora"></div>
  <div class="grid-overlay"></div>

  <!-- Topbar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo"><span></span><span></span><span></span><span></span></div>
      <div class="brand-name">Reservas<small>Institucionales</small></div>
    </div>

    <nav class="nav" id="nav">
      <div class="nav-pill" id="nav-pill"></div>
      <button class="nav-item active" data-view="inicio">
        <svg viewBox="0 0 20 20" fill="none"><path d="M3 10.5L10 4l7 6.5M5 9v7h10V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Inicio
      </button>
      <button class="nav-item" data-view="espacios">
        <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="3" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="3" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/><rect x="11" y="11" width="6" height="6" rx="1.5" stroke="currentColor" stroke-width="1.5"/></svg>
        Espacios
      </button>
      <button class="nav-item" data-view="reservas">
        <svg viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 8h14M7 2v4M13 2v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <span id="reservas-tab-label">Mis reservas</span>
      </button>
      <button class="nav-item admin-only hidden" data-view="usuarios">
        <svg viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        Usuarios
      </button>
    </nav>

    <div class="user-chip">
      <div class="user-meta">
        <div class="uname" id="uname">—</div>
        <div class="urole" id="urole">—</div>
      </div>
      <div class="avatar" id="avatar">U</div>
      <button class="icon-btn" id="btn-logout" title="Cerrar sesión">
        <svg viewBox="0 0 20 20" fill="none"><path d="M8 17H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3M13 14l4-4-4-4M17 10H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <!-- Contenido -->
  <div class="shell">

    <!-- ── INICIO ── -->
    <section class="view active" id="view-inicio">
      <div class="view-head">
        <div>
          <h1 id="greeting">Hola</h1>
          <p>Resumen de tu actividad en el sistema</p>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="view-head" style="margin-top:0.5rem"><div><h1 style="font-size:1.15rem">Reservas recientes</h1></div></div>
      <div id="recent"></div>
    </section>

    <!-- ── ESPACIOS ── -->
    <section class="view" id="view-espacios">
      <div class="view-head">
        <div>
          <h1>Espacios <em>institucionales</em></h1>
          <p id="espacios-sub">Selecciona un espacio para reservar</p>
        </div>
        <button class="btn btn-primary admin-only hidden" data-action="new-espacio">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Nuevo espacio
        </button>
      </div>
      <div class="grid" id="lista-espacios"></div>
    </section>

    <!-- ── RESERVAS ── -->
    <section class="view" id="view-reservas">
      <div class="view-head">
        <div>
          <h1 id="reservas-title">Mis <em>reservas</em></h1>
          <p id="reservas-sub">Historial y estado de tus solicitudes</p>
        </div>
      </div>
      <div id="lista-reservas"></div>
    </section>

    <!-- ── USUARIOS (admin) ── -->
    <section class="view" id="view-usuarios">
      <div class="view-head">
        <div>
          <h1>Usuarios <em>registrados</em></h1>
          <p>Gestiona las cuentas del sistema</p>
        </div>
        <button class="btn btn-primary" data-action="new-usuario">
          <svg viewBox="0 0 20 20" fill="none"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Nuevo usuario
        </button>
      </div>
      <div id="lista-usuarios"></div>
    </section>

  </div>

  <!-- Modal & toasts -->
  <div class="modal-root" id="modal-root"></div>
  <div class="toast-root" id="toast-root"></div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
